name: hsu_schedule
description: "课程表 · Material 3 课程表与桌面小组件（Android / Windows）"
publish_to: 'none'
version: 2.0.14+16

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  pointycastle: ^4.0.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  window_manager: ^0.5.2
  workmanager: ^0.10.10
  home_widget: ^0.10.0
  dynamic_color: ^1.8.1
  m3e_core: ^1.1.4
  flutoryx: ^1.7.0
  webview_flutter: ^4.13.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/donate_wechat.png
    - assets/donate_alipay.jpg
  fonts:
    - family: FangSongCN
      fonts:
        - asset: assets/FangSongCN.ttf
    - family: TimesNewRoman
      fonts:
        - asset: assets/TimesNewRoman.ttf
    - family: FusionPixel
      fonts:
        - asset: assets/FusionPixel12.ttf
    - family: PixelIcons
      fonts:
        - asset: assets/Pixelarticons.ttf

dependency_overrides:
  material_ui: 1.3.0
  shared_preferences_android: 2.4.28
  path_provider_android: 2.2.23
